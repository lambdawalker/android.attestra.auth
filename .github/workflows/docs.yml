name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish Attestra auth, Finalize Attestra auth release]
    types: [completed]
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.event.pull_request.head.sha || github.sha }}
      - name: Record exact documentation source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r sites/requirements.txt
      - run: python scripts/docs/inventory.py --check
      - run: python scripts/docs/verify.py
      - run: python scripts/screenshots/suite.py coverage
      - run: python scripts/screenshots/suite.py verify-docs
      - run: python -m unittest discover -s scripts/screenshots -p 'test_*.py'
      - run: python sites/test_build.py
      - run: python sites/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: auth-documentation
          path: sites/dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main before publishing
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_BUILD_SHA: ${{ needs.build.outputs.source }}
        run: |
          head=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          if [ "$head" = "$DOCS_BUILD_SHA" ]; then echo 'publish=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.publish == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.publish == 'true'
        id: deployment
