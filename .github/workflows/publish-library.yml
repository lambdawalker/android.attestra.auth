name: SUB - Shared library publication

on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: maven-central
      module:
        description: 'Gradle library module selected by the dedicated caller'
        type: string
        required: true
      version:
        description: 'Optional X.Y.Z. Blank: reuse unchanged module version, otherwise next patch.'
        required: false
        default: ''
        type: string

      bypass_version_verification:
        description: 'Allow recovery override with an explicit newer version. Central skips the remote version listing. JitPack bypasses older pending attempts.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  configuration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.repository.outputs.environment }}
      publisher: ${{ steps.repository.outputs.publisher }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Rust tooling
        env:
          TOOLING_REF: 'v0.1.28'
        run: |
          if [[ "$TOOLING_REF" == v* ]]; then ref=(--tag "$TOOLING_REF"); else ref=(--rev "$TOOLING_REF"); fi
          cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git "${ref[@]}" android-repo-setup
          cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git --rev 1da53392b262c7c3129d2bd645dfd7b34ead81e1 android-repo-docs
      - run: android-repo-setup publishing_config check
      - id: repository
        env:
          RELEASE_REPOSITORY: ${{ inputs.repository }}
        run: android-repo-setup publishing_config resolve

  jitpack:
    needs: configuration
    if: needs.configuration.outputs.publisher == 'jitpack'
    uses: ./.github/workflows/publish-jitpack.yml
    with:
      environment: ${{ needs.configuration.outputs.environment }}
      module: ${{ inputs.module }}
      version: ${{ inputs.version }}
      bypass_version_verification: ${{ inputs.bypass_version_verification }}

  publish:
    needs: configuration
    if: github.ref == 'refs/heads/main' && needs.configuration.outputs.publisher != 'jitpack'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: ${{ needs.configuration.outputs.environment }}
    env:
      RELEASE_REPOSITORY: ${{ inputs.repository }}
      RELEASE_PUBLISHER: ${{ needs.configuration.outputs.publisher }}
    # Shared with automatic/manual finalization; the delay never holds this lock.
    concurrency:
      group: auth-release
      cancel-in-progress: false
    outputs:
      skip: ${{ steps.release.outputs.skip }}
      version: ${{ steps.release.outputs.version }}
      source: ${{ steps.release.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install pinned Rust tooling
        env:
          TOOLING_REF: 'v0.1.28'
        run: |
          if [[ "$TOOLING_REF" == v* ]]; then ref=(--tag "$TOOLING_REF"); else ref=(--rev "$TOOLING_REF"); fi
          cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git "${ref[@]}" android-repo-setup
          cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git --rev 1da53392b262c7c3129d2bd645dfd7b34ead81e1 android-repo-docs
      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Check required settings before reserving a version
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        run: android-repo-setup publishing_config preflight
      - name: Reconcile previous attempts and choose release version
        id: release
        env:
          RELEASE_MODULE: ${{ inputs.module }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          REQUESTED_VERSION: ${{ inputs.version }}
          BYPASS_VERSION_VERIFICATION: ${{ inputs.bypass_version_verification }}
        shell: bash
        run: |
          args=()
          if [[ "$BYPASS_VERSION_VERIFICATION" == true ]]; then
            args+=(--skip-central-version-check)
          fi
          android-repo-setup module_release prepare --module "$RELEASE_MODULE" --version "$REQUESTED_VERSION" "${args[@]}"
      - name: Check out immutable artifact source
        if: steps.release.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-java@v5
        if: steps.release.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v5
        if: steps.release.outputs.skip != 'true'
        with:
          cache-disabled: true
      - uses: actions/setup-node@v7
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare immutable release assets
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_MODULE: ${{ inputs.module }}
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: android-repo-setup assets prepare --module "$RELEASE_MODULE" --source "$SOURCE_SHA"
      - name: Validate immutable release source
        if: steps.release.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: "sh ./setup.sh release-validate --source \"$SOURCE_SHA\""
      - name: Test and validate complete unsigned publication locally
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_MODULE: ${{ inputs.module }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: |
          env -u RELEASE_REPOSITORY -u MAVEN_REPOSITORY_URL -u MAVEN_REPOSITORY_USERNAME -u MAVEN_REPOSITORY_PASSWORD android-repo-setup publishing_config check
          MODULE_PATH=$(android-repo-setup module-path "$RELEASE_MODULE")
          checks=(verifyImportDocs "$MODULE_PATH:lintRelease" "$MODULE_PATH:assembleRelease")
          ./gradlew "${checks[@]}" "$MODULE_PATH:publishAllPublicationsToVerificationRepository" "-PreleaseModule=$RELEASE_MODULE" "-PreleaseVersion=$RELEASE_VERSION" --no-daemon
          android-repo-setup module_release check-local --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --source "$SOURCE_SHA"
      - name: Reserve immutable version, source, and artifact hashes
        id: reserve
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_MODULE: ${{ inputs.module }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: android-repo-setup module_release reserve --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --source "$SOURCE_SHA"
      - name: Publish and release signed artifacts
        id: upload
        if: steps.release.outputs.skip != 'true'
        timeout-minutes: 35
        env:
          RELEASE_MODULE: ${{ inputs.module }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # The Gradle guard creates a durable upload-started marker before any upload task.
          # Preserve plugin deployment output for Central Portal investigation; no debug logging.
          case "$RELEASE_PUBLISHER" in
            central) task=publishAndReleaseToMavenCentral ;;
            *) echo 'Unknown repository'; exit 1 ;;
          esac
          MODULE_PATH=$(android-repo-setup module-path "$RELEASE_MODULE")
          ./gradlew "$MODULE_PATH:$task" "-PreleaseModule=$RELEASE_MODULE" "-PreleaseVersion=$RELEASE_VERSION" --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/repository-publish.log" | android-repo-setup module_release track-central-upload --module "$RELEASE_MODULE" --version "$RELEASE_VERSION"
      - name: Retain deployment log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-publish.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Reconcile unsuccessful release attempt
        if: failure() && steps.reserve.outcome == 'success'
        env:
          RELEASE_MODULE: ${{ inputs.module }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: android-repo-setup module_release reconcile --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --apply
      - name: Recovery guidance
        if: failure()
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo '### Maven Central release recovery'
            printf 'Destination: `%s` · Module: `%s` · Version: `%s`\n\n' "$RELEASE_REPOSITORY" "$RELEASE_MODULE" "${RELEASE_VERSION:-unresolved}"
            case "$UPLOAD_OUTCOME" in
              success) echo 'The upload step succeeded. Use **SUB - Finalize Attestra Auth release** with the destination and version above.' ;;
              failure|cancelled) echo 'The upload step ran and its result is uncertain. Inspect Central Portal. If the upload exists, use **SUB - Finalize Attestra Auth release** with the destination and version above.' ;;
              *) echo 'The upload step did not start. Fix the failed step and check for a reservation before retrying.' ;;
            esac
            echo 'Review the reconciliation report above. Verified failures are archived; published artifacts are finalized without upload. Active or uncertain attempts remain pending. The next run checks again. See docs/releases.md.'
          } >> "$GITHUB_STEP_SUMMARY"

  propagation-delay:
    name: Wait for Maven Central propagation (15 minutes)
    needs: [publish, configuration]
    if: needs.configuration.outputs.publisher == 'central' && needs.publish.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    # Configure the 15-minute wait timer in repository Settings > Environments.
    # No runner is held during the environment wait, and no release lock is held.
    environment: delayed-docs
    steps:
      - run: echo 'Environment delay complete; ready to verify Maven Central.'

  finalize:
    name: Verify public artifacts and finalize release
    needs: [publish, propagation-delay]
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.skip != 'true' &&
          (needs.propagation-delay.result == 'success' ||
           needs.propagation-delay.result == 'skipped') }}
    uses: ./.github/workflows/finalize-release.yml
    secrets: inherit
    with:
      repository: ${{ inputs.repository }}
      module: ${{ inputs.module }}
      version: ${{ needs.publish.outputs.version }}
      source: ${{ needs.publish.outputs.source }}
