name: Render documentation screenshots
on:
  pull_request:
  push:
    branches: [main, previews]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Render all screenshot previews
        run: bash gradlew :auth:updateDebugScreenshotTest --stacktrace
      - name: Check rendering and export documentation gallery
        run: python3 scripts/screenshots/export.py
      - name: Validate rendered references
        run: bash gradlew :auth:validateDebugScreenshotTest --stacktrace
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-screenshots
          path: |
            docs/generated/screenshots/
            auth/src/screenshotTestDebug/reference/
            auth/build/reports/screenshotTest/
            auth/build/outputs/screenshotTest-results/
          if-no-files-found: error
