name: Render documentation screenshots
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generate candidates for review, or validate accepted baselines'
        type: choice
        options: [candidates, validate]
        default: candidates
concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify required scenarios and coverage
        run: |
          python3 scripts/screenshots/suite.py coverage
          python3 -m unittest discover -s scripts/screenshots -p 'test_*.py'
      - name: Generate candidates without accepting them
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'candidates'
        run: |
          bash gradlew :auth:updateDebugScreenshotTest :app:updateDebugScreenshotTest --stacktrace
          python3 scripts/screenshots/suite.py candidates
      - name: Restore reviewed baseline inputs
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'candidates'
        run: python3 scripts/screenshots/suite.py restore
      - name: Compare with accepted baselines without updating
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'candidates'
        run: bash gradlew :auth:validateDebugScreenshotTest :app:validateDebugScreenshotTest --stacktrace
      - name: Upload candidate images and comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onboarding-screenshots
          path: |
            docs/generated/screenshots/
            auth/build/reports/screenshotTest/
            auth/build/outputs/screenshotTest-results/
            app/build/reports/screenshotTest/
            app/build/outputs/screenshotTest-results/
          if-no-files-found: warn
