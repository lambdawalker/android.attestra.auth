name: Android verification
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      # Use the hosted Android SDK; AGP resolves the pinned SDK components.
      - uses: gradle/actions/setup-gradle@v4
      - name: Test auth and assemble app
        run: >-
          bash gradlew :auth:testDebugUnitTest :identity-mock:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          -PattestraApiBaseUrl=https://api.example.invalid
          -PattestraLinkHost=app.example.invalid
